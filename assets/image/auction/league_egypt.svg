<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC640"/>
      <stop offset="0.55" stop-color="#D9541E"/>
      <stop offset="1" stop-color="#7A0A1A"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#E09A00"/>
    </linearGradient>
    <clipPath id="shield"><path d="M100 40 L152 56 L152 104 C152 136 130 158 100 172 C70 158 48 136 48 104 L48 56 Z"/></clipPath>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <g fill="#FFFFFF" fill-opacity="0.08">
    <path d="M100 110 L70 0 L130 0 Z"/>
    <path d="M100 110 L200 60 L200 120 Z"/>
    <path d="M100 110 L0 60 L0 120 Z"/>
  </g>

  <path d="M100 40 L152 56 L152 104 C152 136 130 158 100 172 C70 158 48 136 48 104 L48 56 Z" fill="#000000" fill-opacity="0.3" transform="translate(0 6)"/>
  <g clip-path="url(#shield)">
    <rect x="40" y="30" width="120" height="150" fill="#FFFFFF"/>
    <rect x="40" y="30" width="120" height="54" fill="#CE1126"/>
    <rect x="40" y="128" width="120" height="52" fill="#141414"/>
    <!-- pyramids on the white band -->
    <path d="M60 128 L86 96 L112 128 Z" fill="url(#gold)"/>
    <path d="M86 96 L112 128 L96 128 Z" fill="#B37E00"/>
    <path d="M100 128 L122 102 L144 128 Z" fill="url(#gold)"/>
    <path d="M122 102 L144 128 L131 128 Z" fill="#B37E00"/>
  </g>
  <path d="M100 40 L152 56 L152 104 C152 136 130 158 100 172 C70 158 48 136 48 104 L48 56 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

  <!-- sun disk -->
  <circle cx="100" cy="66" r="11" fill="url(#gold)" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- wings -->
  <g fill="url(#gold)" stroke="#7A4A00" stroke-width="2" stroke-linejoin="round">
    <path d="M92 30 C78 18 52 16 36 24 C50 26 58 30 62 36 C52 34 44 36 38 42 C54 40 70 42 84 44 Z"/>
    <path d="M108 30 C122 18 148 16 164 24 C150 26 142 30 138 36 C148 34 156 36 162 42 C146 40 130 42 116 44 Z"/>
  </g>
  <circle cx="100" cy="34" r="9" fill="url(#gold)" stroke="#7A4A00" stroke-width="2"/>

  <!-- star -->
  <path d="M100 146 L103 154 L111 155 L105 160 L107 168 L100 164 L93 168 L95 160 L89 155 L97 154 Z" fill="#FFC640"/>
</svg>
