<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D3A8C"/>
      <stop offset="1" stop-color="#081536"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <g fill="#FFFFFF" fill-opacity="0.04">
    <path d="M120 120 L90 0 L150 0 Z"/>
    <path d="M120 120 L240 90 L240 150 Z"/>
    <path d="M120 120 L150 240 L90 240 Z"/>
    <path d="M120 120 L0 150 L0 90 Z"/>
  </g>

  <!-- empty card slots -->
  <rect x="58" y="62" width="84" height="116" rx="14" fill="none" stroke="#7B90C2" stroke-width="5" stroke-dasharray="12 9" transform="rotate(-10 100 120)"/>
  <rect x="98" y="58" width="84" height="116" rx="14" fill="#16307A" stroke="#A9BDE6" stroke-width="5" transform="rotate(8 140 116)"/>

  <!-- fist / hand-only icon: a gavel -->
  <g transform="translate(140 118) rotate(-35)">
    <rect x="-5" y="-4" width="10" height="56" rx="4" fill="#A9BDE6"/>
    <rect x="-24" y="-24" width="48" height="22" rx="6" fill="#CFE0FF"/>
  </g>

  <!-- no sign -->
  <circle cx="176" cy="176" r="30" fill="#081536" stroke="#FF6B6F" stroke-width="7"/>
  <path d="M155 155 L197 197" stroke="#FF6B6F" stroke-width="7" stroke-linecap="round"/>
</svg>
