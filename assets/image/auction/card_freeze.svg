<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9FF3FF"/>
      <stop offset="0.5" stop-color="#2FA8E0"/>
      <stop offset="1" stop-color="#0A2A6E"/>
    </linearGradient>
    <radialGradient id="halo" cx="120" cy="120" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BFF3FF"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="110" fill="url(#halo)"/>

  <!-- frozen gavel -->
  <g transform="translate(120 122) rotate(-30)" opacity="0.55">
    <rect x="-5" y="-6" width="10" height="80" rx="4" fill="#5A2E0C"/>
    <rect x="-28" y="-28" width="56" height="24" rx="7" fill="#7A4220"/>
  </g>

  <!-- snowflake -->
  <g transform="translate(120 120)" stroke="#0A2A6E" stroke-width="16" stroke-linecap="round" stroke-opacity="0.25">
    <path d="M0 -84 L0 84"/>
    <path d="M0 -84 L0 84" transform="rotate(60)"/>
    <path d="M0 -84 L0 84" transform="rotate(120)"/>
  </g>
  <g transform="translate(120 118)" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <g stroke-width="11">
      <path d="M0 -84 L0 84"/>
      <path d="M0 -84 L0 84" transform="rotate(60)"/>
      <path d="M0 -84 L0 84" transform="rotate(120)"/>
    </g>
    <g stroke-width="8">
      <path d="M-22 -72 L0 -50 L22 -72"/>
      <path d="M-22 -72 L0 -50 L22 -72" transform="rotate(60)"/>
      <path d="M-22 -72 L0 -50 L22 -72" transform="rotate(120)"/>
      <path d="M-22 -72 L0 -50 L22 -72" transform="rotate(180)"/>
      <path d="M-22 -72 L0 -50 L22 -72" transform="rotate(240)"/>
      <path d="M-22 -72 L0 -50 L22 -72" transform="rotate(300)"/>
    </g>
  </g>
  <g transform="translate(120 118)">
    <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="#0A2A6E" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>
    <!-- lock -->
    <rect x="-10" y="-3" width="20" height="16" rx="3" fill="#FFFFFF"/>
    <path d="M-6 -3 L-6 -9 C-6 -16 6 -16 6 -9 L6 -3" fill="none" stroke="#FFFFFF" stroke-width="3.5"/>
  </g>

  <g fill="#FFFFFF">
    <circle cx="40" cy="44" r="5"/>
    <circle cx="204" cy="60" r="4"/>
    <circle cx="198" cy="196" r="6"/>
    <circle cx="44" cy="190" r="4"/>
    <circle cx="214" cy="128" r="3"/>
  </g>
</svg>
