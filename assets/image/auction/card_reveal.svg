<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8A3CFF"/>
      <stop offset="1" stop-color="#1A0B4A"/>
    </linearGradient>
    <radialGradient id="halo" cx="120" cy="120" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#D59BFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#D59BFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="0.4" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#E8FFFF"/>
      <stop offset="1" stop-color="#7FE6FF"/>
    </radialGradient>
    <clipPath id="lensClip"><circle cx="136" cy="104" r="50"/></clipPath>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <circle cx="120" cy="120" r="110" fill="url(#halo)"/>
  <g fill="#FFFFFF" fill-opacity="0.06">
    <path d="M120 120 L90 0 L150 0 Z"/>
    <path d="M120 120 L240 90 L240 150 Z"/>
    <path d="M120 120 L0 150 L0 90 Z"/>
  </g>

  <!-- hidden player silhouette -->
  <g fill="#2A1466" stroke="#B98CFF" stroke-width="3">
    <circle cx="104" cy="88" r="32"/>
    <path d="M40 210 C40 150 70 128 104 128 C138 128 168 150 168 210 Z"/>
  </g>
  <path d="M92 76 C92 62 116 62 116 76 C116 88 104 88 104 100" fill="none" stroke="#B98CFF" stroke-width="7" stroke-linecap="round"/>
  <circle cx="104" cy="111" r="4.5" fill="#B98CFF"/>

  <!-- magnifier lens showing the revealed info -->
  <circle cx="136" cy="104" r="50" fill="url(#lens)"/>
  <g clip-path="url(#lensClip)">
    <circle cx="104" cy="88" r="32" fill="#FFC640"/>
    <path d="M40 210 C40 150 70 128 104 128 C138 128 168 150 168 210 Z" fill="#1A1AD6"/>
    <path d="M86 80 Q93 74 100 80 M108 80 Q115 74 122 80" fill="none" stroke="#1A1200" stroke-width="4" stroke-linecap="round"/>
    <path d="M92 100 Q104 108 116 100" fill="none" stroke="#1A1200" stroke-width="4" stroke-linecap="round"/>
    <path d="M150 140 L182 140 L182 170 L150 170 Z" fill="#FFFFFF" fill-opacity="0.9"/>
    <path d="M156 150 L176 150 M156 160 L170 160" stroke="#1A1AD6" stroke-width="4" stroke-linecap="round"/>
  </g>
  <ellipse cx="116" cy="80" rx="16" ry="9" fill="#FFFFFF" fill-opacity="0.45" transform="rotate(-35 116 80)"/>
  <circle cx="136" cy="104" r="50" fill="none" stroke="#FFC640" stroke-width="10"/>
  <path d="M172 140 L206 174" stroke="#FFC640" stroke-width="18" stroke-linecap="round"/>
  <path d="M172 140 L206 174" stroke="#7A4A00" stroke-width="4" stroke-linecap="round" stroke-opacity="0.45"/>

  <g fill="#FFFFFF">
    <path d="M196 40 L199 49 L208 52 L199 55 L196 64 L193 55 L184 52 L193 49 Z"/>
    <path d="M36 52 L38.5 58.5 L45 61 L38.5 63.5 L36 70 L33.5 63.5 L27 61 L33.5 58.5 Z"/>
  </g>
</svg>
