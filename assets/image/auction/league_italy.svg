  <path d="M100 40 L152 56 L152 104 C152 136 130 158 100 172 C70 158 48 136 48 104 L48 56 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

  <!-- big star -->
  <path d="M100 76 L107 94 L126 95 L111 107 L116 126 L100 115 L84 126 L89 107 L74 95 L93 94 Z" fill="url(#gold)" stroke="#7A4A00" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- small stars -->
