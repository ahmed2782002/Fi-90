    <clipPath id="shield"><path d="M100 40 L152 56 L152 104 C152 136 130 158 100 172 C70 158 48 136 48 104 L48 56 Z"/></clipPath>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <g fill="#FFFFFF" fill-opacity="0.08">
    <path d="M100 110 L70 0 L130 0 Z"/>
    <path d="M100 110 L200 60 L200 120 Z"/>
    <path d="M100 110 L0 60 L0 120 Z"/>
  </g>

  <!-- laurel -->
  <g fill="#2EE59D" stroke="#0C6B38" stroke-width="1.5">
    <ellipse cx="34" cy="150" rx="5" ry="11" transform="rotate(-30 34 150)"/>
    <ellipse cx="26" cy="128" rx="5" ry="11" transform="rotate(-12 26 128)"/>
    <ellipse cx="24" cy="104" rx="5" ry="11" transform="rotate(4 24 104)"/>
    <ellipse cx="28" cy="80" rx="5" ry="11" transform="rotate(20 28 80)"/>
    <ellipse cx="166" cy="150" rx="5" ry="11" transform="rotate(30 166 150)"/>
    <ellipse cx="174" cy="128" rx="5" ry="11" transform="rotate(12 174 128)"/>
    <ellipse cx="176" cy="104" rx="5" ry="11" transform="rotate(-4 176 104)"/>
    <ellipse cx="172" cy="80" rx="5" ry="11" transform="rotate(-20 172 80)"/>
