<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="0.55" stop-color="#E09A00"/>
      <stop offset="1" stop-color="#6B3F00"/>
    </linearGradient>
    <radialGradient id="halo" cx="120" cy="110" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF6D6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FFF6D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF1B0"/>
      <stop offset="0.5" stop-color="#FFC640"/>
      <stop offset="1" stop-color="#C77F00"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A8642A"/>
      <stop offset="1" stop-color="#5A2E0C"/>
    </linearGradient>
  </defs>
  <rect width="240" height="240" fill="url(#bg)"/>
  <g fill="#FFFFFF" fill-opacity="0.13">
    <path d="M120 110 L95 0 L145 0 Z"/>
    <path d="M120 110 L240 70 L240 120 Z"/>
    <path d="M120 110 L0 70 L0 120 Z"/>
    <path d="M120 110 L230 240 L180 240 Z"/>
    <path d="M120 110 L10 240 L60 240 Z"/>
