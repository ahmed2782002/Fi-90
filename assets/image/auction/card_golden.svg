    <path d="M48 46 L52 58 L64 62 L52 66 L48 78 L44 66 L32 62 L44 58 Z"/>
    <path d="M192 40 L195 49 L204 52 L195 55 L192 64 L189 55 L180 52 L189 49 Z"/>
