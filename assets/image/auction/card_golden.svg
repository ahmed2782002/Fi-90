    <rect x="-34" y="-34" width="68" height="28" rx="8" fill="url(#wood)" stroke="#3A1C05" stroke-width="3"/>
    <rect x="-38" y="-36" width="10" height="32" rx="4" fill="#FFC640" stroke="#3A1C05" stroke-width="3"/>
    <rect x="28" y="-36" width="10" height="32" rx="4" fill="#FFC640" stroke="#3A1C05" stroke-width="3"/>
  </g>

  <!-- crown -->
  <g transform="translate(120 104)">
