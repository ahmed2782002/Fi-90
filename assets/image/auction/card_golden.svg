    <path d="M-56 22 L-64 -30 L-30 -2 L0 -44 L30 -2 L64 -30 L56 22 Z" fill="url(#gold)" stroke="#7A4A00" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-58" y="20" width="116" height="18" rx="4" fill="url(#gold)" stroke="#7A4A00" stroke-width="4"/>
    <circle cx="0" cy="-44" r="7" fill="#FFFFFF" stroke="#7A4A00" stroke-width="3"/>
    <circle cx="-64" cy="-30" r="6" fill="#FFFFFF" stroke="#7A4A00" stroke-width="3"/>
    <circle cx="64" cy="-30" r="6" fill="#FFFFFF" stroke="#7A4A00" stroke-width="3"/>
    <circle cx="0" cy="6" r="9" fill="#E3262B" stroke="#7A4A00" stroke-width="3"/>
    <circle cx="-32" cy="12" r="6" fill="#3FD4FF" stroke="#7A4A00" stroke-width="3"/>
    <circle cx="32" cy="12" r="6" fill="#2EE59D" stroke="#7A4A00" stroke-width="3"/>
    <path d="M-40 -10 L-46 16" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>

