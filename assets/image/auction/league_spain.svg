<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF5A4B"/>
      <stop offset="1" stop-color="#6E0012"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#E09A00"/>
    </linearGradient>
    <clipPath id="shield"><path d="M100 40 L152 56 L152 104 C152 136 130 158 100 172 C70 158 48 136 48 104 L48 56 Z"/></clipPath>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <g fill="#FFFFFF" fill-opacity="0.07">
    <path d="M100 110 L70 0 L130 0 Z"/>
    <path d="M100 110 L200 60 L200 120 Z"/>
    <path d="M100 110 L0 60 L0 120 Z"/>
  </g>

  <!-- shield -->
  <path d="M100 40 L152 56 L152 104 C152 136 130 158 100 172 C70 158 48 136 48 104 L48 56 Z" fill="#000000" fill-opacity="0.3" transform="translate(0 6)"/>
  <g clip-path="url(#shield)">
    <rect x="40" y="30" width="120" height="150" fill="#C8102E"/>
    <rect x="40" y="78" width="120" height="50" fill="#FFC400"/>
  </g>
  <path d="M100 40 L152 56 L152 104 C152 136 130 158 100 172 C70 158 48 136 48 104 L48 56 Z" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linejoin="round"/>

  <!-- sun -->
  <g transform="translate(100 103)">
    <g fill="#C8102E">
      <path d="M0 -24 L4 -14 L-4 -14 Z"/>
      <path d="M0 -24 L4 -14 L-4 -14 Z" transform="rotate(45)"/>
      <path d="M0 -24 L4 -14 L-4 -14 Z" transform="rotate(90)"/>
      <path d="M0 -24 L4 -14 L-4 -14 Z" transform="rotate(135)"/>
      <path d="M0 -24 L4 -14 L-4 -14 Z" transform="rotate(180)"/>
      <path d="M0 -24 L4 -14 L-4 -14 Z" transform="rotate(225)"/>
      <path d="M0 -24 L4 -14 L-4 -14 Z" transform="rotate(270)"/>
      <path d="M0 -24 L4 -14 L-4 -14 Z" transform="rotate(315)"/>
    </g>
    <circle r="12" fill="#C8102E"/>
    <circle r="7" fill="#FFC400"/>
  </g>

  <!-- crown -->
  <g transform="translate(100 34)">
    <path d="M-30 10 L-34 -16 L-16 -2 L0 -22 L16 -2 L34 -16 L30 10 Z" fill="url(#gold)" stroke="#7A4A00" stroke-width="2.5" stroke-linejoin="round"/>
    <rect x="-31" y="10" width="62" height="9" rx="2" fill="url(#gold)" stroke="#7A4A00" stroke-width="2.5"/>
    <circle cx="0" cy="-22" r="4" fill="#FFFFFF"/>
    <circle cx="-34" cy="-16" r="3.5" fill="#FFFFFF"/>
    <circle cx="34" cy="-16" r="3.5" fill="#FFFFFF"/>
    <circle cx="0" cy="2" r="4" fill="#C8102E"/>
  </g>
</svg>
